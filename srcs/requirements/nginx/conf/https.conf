server {
	# Listen to ports 80 and 443
	listen 443 ssl;
	listen [::]:443 ssl;

	# Set server name
	server_name INSERT_DOMAIN_NAME_HERE;

	# Set certificate and key
	ssl_certificate_key INSERT_KEY_PATH_HERE;
	ssl_certificate INSERT_CRT_PATH_HERE;
	ssl_protocols TLSv1.2 TLSv1.3;

	# -------------------------------------------------------#
	# -------------------- WORDPRESS ------------------------#
	# -------------------------------------------------------#

	# Set root directory
	root /var/www/html;

	# Set index file
	index index.php;

	# Let WordPress route requests that don't match a real file/directory
	# (needed for "pretty" permalinks, e.g. /2024/my-post/).
	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	# Forward PHP calls to FastCGI server
	location ~ \.php$ {
		include snippets/fastcgi-php.conf;
		fastcgi_pass wordpress:9000;
	}
}